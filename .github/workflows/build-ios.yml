name: Build WinDock iOS

on:
  workflow_dispatch:
  push:
    branches: [windock-ios]

permissions:
  contents: write # publishes the IPA to the windock-ios-ipa branch

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version
          cd ios
          swift scripts/generate-icon.swift
          xcodegen generate
      - name: Start isolated WinDock host
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p ios/build
          node ios/scripts/smoke-host.mjs > ios/build/fixture.log 2>&1 &
          echo $! > ios/build/fixture.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18622/health; then exit 0; fi
            sleep 1
          done
          cat ios/build/fixture.log
          exit 1
      - name: Choose iPhone simulator
        run: |
          xcrun simctl list devices available -j > ios/build/simulators.json
          DEVICE_ID=$(python3 - <<'PY'
          import json
          devices = json.load(open('ios/build/simulators.json'))['devices']
          for runtime, candidates in sorted(devices.items(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              phones = [d for d in candidates if d['name'].startswith('iPhone')]
              if phones:
                  preferred = next((d for d in phones if d['name'] == 'iPhone 16'), phones[0])
                  print(preferred['udid'])
                  break
          else:
              raise SystemExit('No available iPhone simulator')
          PY
          )
          echo "IOS_SIMULATOR=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build and test in iPhone simulator
        run: |
          set -o pipefail
          xcodebuild test -project ios/WinDock.xcodeproj -scheme WinDock \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR" \
            -derivedDataPath ios/build/DerivedData -resultBundlePath ios/build/Tests.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            | tee ios/build/simulator-build.log
          node ios/scripts/verify-events.mjs
      - name: Build unsigned iPhone archive
        run: |
          set -o pipefail
          xcodebuild archive -project ios/WinDock.xcodeproj -scheme WinDock -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ios/build/WinDock-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO | tee ios/build/device-build.log
          ditto -c -k --keepParent ios/build/WinDock-unsigned.xcarchive ios/build/WinDock-unsigned-archive.zip
          ditto -c -k --keepParent ios/build/DerivedData/Build/Products/Debug-iphonesimulator/WinDock.app ios/build/WinDock-simulator.zip
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=ios/build/WinDock-unsigned.xcarchive/Products/Applications/WinDock.app
          lipo -info "$APP/WinDock"
          rm -rf ios/build/ipa && mkdir -p ios/build/ipa/Payload
          ditto "$APP" ios/build/ipa/Payload/WinDock.app
          (cd ios/build/ipa && zip -qry ../WinDock-unsigned.ipa Payload)
          unzip -l ios/build/WinDock-unsigned.ipa | tail -1
          shasum -a 256 ios/build/WinDock-unsigned.ipa | tee ios/build/WinDock-unsigned.ipa.sha256
      - name: Publish IPA to windock-ios-ipa branch
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ipa-branch"
          rm -rf "$OUT" && mkdir -p "$OUT" && cd "$OUT"
          git init -q -b windock-ios-ipa
          cp "$GITHUB_WORKSPACE/ios/build/WinDock-unsigned.ipa" "$GITHUB_WORKSPACE/ios/build/WinDock-unsigned.ipa.sha256" .
          printf '# WinDock unsigned IPA\n\nBuilt from %s (run %s). Unsigned: re-sign with your Apple ID (for example Sideloadly) before installing.\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > README.md
          git add .
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "WinDock unsigned IPA from ${GITHUB_SHA::7} (run $GITHUB_RUN_NUMBER)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" windock-ios-ipa
      - name: Collect screenshots and stop fixture
        if: always()
        run: |
          if [ -d ios/build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/build/Tests.xcresult --output-path ios/build/screenshots || true
          fi
          if [ -f ios/build/fixture.pid ]; then kill "$(cat ios/build/fixture.pid)" || true; fi
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinDock-iOS-build-${{ github.run_number }}
          retention-days: 14
          path: |
            ios/build/WinDock-unsigned-archive.zip
            ios/build/WinDock-unsigned.ipa
            ios/build/WinDock-simulator.zip
            ios/build/Tests.xcresult
            ios/build/screenshots
            ios/build/*.log
            ios/build/fixture/events.json
      - name: Explain build output
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## WinDock iOS development build
          - Native landscape connection screen and the shared WinDock dock.
          - Simulator tests use the real PIN/cookie/WebSocket host with a fake PC provider.
          - The simulator app runs in Xcode's iOS Simulator on a Mac.
          - The unsigned device archive is **not installable on an iPhone**. No IPA or TestFlight release is published.
          - Signing/provisioning and physical iPhone testing are separate next steps.
          - Screenshots and test results are included in the build artifact (14-day retention).
          MD
